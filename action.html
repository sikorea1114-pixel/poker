<style>
:root{--navy:#182b49;--blue:#315b91;--mint:#41c98a;--yellow:#f5b301;--red:#e5484d;--muted:#667085}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:linear-gradient(160deg,#ffe3ee 0%,#fff6dc 45%,#dff7ea 100%) fixed}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--navy);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.page{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.logo{display:block;height:clamp(54px,11vh,100px);width:auto;max-width:100%;margin:0 auto;border-radius:16px;box-shadow:0 4px 14px #3b2a5a22}
.clock{flex:1;min-height:0;background:#ffffffee;border-radius:30px;box-shadow:0 10px 30px #3b2a5a1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .25s;padding:12px}
.ring{position:relative;width:min(78vw,46vh,380px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:#e8ecf3}
.ring .fg{stroke:var(--mint);transition:stroke .25s}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:min(36vw,22vh,170px);line-height:1}
.msg{font-weight:800;font-size:clamp(18px,3.2vh,26px);text-align:center;min-height:1.5em}
.sub{font-size:clamp(12px,2vh,15px);color:var(--muted);text-align:center;min-height:1.3em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:0 10px;min-height:58px;background:#fff;color:var(--navy);box-shadow:0 2px 8px #3b2a5a1a;font-size:17px;cursor:pointer}
button:active{transform:translateY(1px)}
button.main{grid-column:1/-1;min-height:74px;background:var(--navy);color:#fff;font-size:22px}
button.warn{color:#b42318;background:#fff0f0}
/* states */
body.warn .fg{stroke:var(--yellow)}
body.warn .num{color:#b87900}
body.over .clock{background:#ffe9ea}
body.over .fg{stroke:var(--red)}
body.over .num,body.over .msg{color:var(--red)}
body.over .clock{animation:blink .5s 4}
@keyframes blink{50%{background:#ffc9cc}}
body.paused .num{opacity:.45}
</style>

  <div class="clock" id="clock">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="fg" cx="50" cy="50" r="44"/></svg>
      <div class="num" id="num">30</div>
    </div>
    <div class="msg" id="msg">화면을 누르면 시작</div>
    <div class="sub" id="sub">액션 차례가 정해진 순간부터 측정합니다</div>
  </div>
  <div class="btns">
    <button class="main" id="next">다음 사람 · 30초 시작</button>
    <button id="reset" class="warn">초기화</button>
    <button id="sound">소리 켜짐</button>
  </div>
</div>
<script>
(function(){
  var TOTAL=30000, C=2*Math.PI*44;
  var s={st:'idle',remaining:TOTAL,endAt:0,lastSec:31,muted:false};
  var $=function(i){return document.getElementById(i)};
  var fg=$('fg'); fg.style.strokeDasharray=C;

  var actx=null;
  function ac(){
    if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(actx&&actx.state==='suspended'){try{actx.resume()}catch(e){}}
    return actx;
  }
  function tone(f,at,d,v){
    var a=actx; if(!a)return;
    var o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v||0.3,at+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,at+d);
    o.connect(g); g.connect(a.destination); o.start(at); o.stop(at+d+0.05);
  }
  function snd(kind){
    if(s.muted)return;
    var a=ac(); if(!a)return; var t=a.currentTime+0.01;
    if(kind==='tick'){tone(1000,t,0.18,0.28)}
    else if(kind==='ten'){tone(784,t,0.5,0.3)}
    else if(kind==='over'){tone(880,t,0.8,0.4);tone(880,t+0.9,0.8,0.4);tone(660,t+1.8,1.2,0.4)}
  }
  function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

  var wl=null;
  function lock(){try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}}catch(e){}}
  function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&s.st==='run')lock()});

  function begin(){ac();s.st='run';s.remaining=TOTAL;s.endAt=Date.now()+TOTAL;s.lastSec=31;lock();render()}
  function pause(){s.remaining=Math.max(0,s.endAt-Date.now());s.st='pause';unlock();render()}
  function resume(){ac();s.st='run';s.endAt=Date.now()+s.remaining;lock();render()}
  function reset(){s.st='idle';s.remaining=TOTAL;s.lastSec=31;unlock();render()}
  function tap(){
    if(s.st==='idle')begin();
    else if(s.st==='run')pause();
    else if(s.st==='pause')resume();
    else if(s.st==='over')reset();
  }
  function tick(){
    if(s.st!=='run')return;
    var rem=s.endAt-Date.now();
    if(rem<=0){s.remaining=0;s.st='over';unlock();snd('over');vib([500,150,500,150,500]);render();return}
    s.remaining=rem;
    var sec=Math.ceil(rem/1000);
    if(sec!==s.lastSec){
      s.lastSec=sec;
      if(sec===10){snd('ten');vib(80)}
      else if(sec<=5){snd('tick');vib(40)}
    }
    render();
  }
  function render(){
    var sec=Math.ceil(s.remaining/1000);
    $('num').textContent=sec;
    fg.style.strokeDashoffset=C*(1-s.remaining/TOTAL);
    var cls=[];
    if(s.st==='over')cls.push('over');
    else if(s.st!=='idle'&&sec<=10)cls.push('warn');
    if(s.st==='pause')cls.push('paused');
    document.body.className=cls.join(' ');
    var m=$('msg'),sub=$('sub');
    if(s.st==='idle'){m.textContent='화면을 누르면 시작';sub.textContent='액션 차례가 정해진 순간부터 측정합니다'}
    else if(s.st==='run'){m.textContent='생각 중';sub.textContent='화면을 누르면 일시정지'}
    else if(s.st==='pause'){m.textContent='일시정지';sub.textContent='화면을 누르면 계속'}
    else{m.textContent='타임오버';sub.textContent='타임칩 1개 차감 · 화면을 누르면 처음으로'}
    $('next').textContent=s.st==='idle'?'30초 시작':'다음 사람 · 30초 시작';
    $('sound').textContent=s.muted?'소리 꺼짐':'소리 켜짐';
  }
  $('clock').addEventListener('click',tap);
  $('next').addEventListener('click',begin);
  $('reset').addEventListener('click',reset);
  $('sound').addEventListener('click',function(){s.muted=!s.muted;if(!s.muted)ac();render()});
  document.addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();tap()}else if(e.key==='Enter'){begin()}});
  setInterval(tick,100);
  render();
})();
</script>
</body>
