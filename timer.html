<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라티파티 홀덤 타이머</title>
<meta property="og:title" content="라티파티 홀덤 타이머">
<meta property="og:description" content="라티파티 홀덤 미니토너먼트 블라인드 레벨 타이머">
<style>
:root{--navy:#182b49;--blue:#315b91;--mint:#8fe3b8;--yellow:#ffe27a;--pink:#f7a1c2;--sky:#8ccdf5;--ink:#202735;--muted:#667085}
*{box-sizing:border-box}
html{background:linear-gradient(160deg,#ffe3ee 0%,#fff6dc 45%,#dff7ea 100%) fixed}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  background:transparent}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,18px);padding:clamp(10px,2vh,22px) clamp(10px,2vw,28px)}
.logo{display:block;max-width:min(100%,980px);max-height:14vh;width:auto;height:auto;border-radius:22px;box-shadow:0 6px 22px #3b2a5a22}
.card{flex:1;width:min(100%,1100px);background:#ffffffee;border-radius:30px;box-shadow:0 10px 36px #3b2a5a1f;padding:clamp(14px,2.6vh,30px) clamp(14px,3vw,40px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,16px);text-align:center;transition:background .4s}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--mint);color:#0f4d33;font-weight:800;font-size:clamp(16px,3vh,28px);letter-spacing:.06em;border-radius:999px;padding:.25em .9em}
.meta{color:var(--muted);font-size:clamp(13px,2.2vh,20px);font-weight:600}
.note{min-height:1.4em;font-size:clamp(13px,2.2vh,20px);font-weight:700;color:#a35f00;background:#fff3d6;border-radius:999px;padding:.2em 1em;visibility:hidden}
.note.show{visibility:visible}
.time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em;font-size:min(22vw,20vh)}
.bar{width:min(100%,820px);height:clamp(8px,1.4vh,14px);background:#e8ecf3;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:999px;transition:width .3s linear}
.blinds{display:flex;gap:clamp(10px,2.4vw,28px);justify-content:center;flex-wrap:wrap;width:100%}
.box{flex:1 1 220px;max-width:520px;background:#edf3fb;border-radius:22px;padding:clamp(8px,1.6vh,18px) 16px}
.box.ante{background:#fff0f6;max-width:300px}
.box small{display:block;color:var(--muted);font-weight:700;font-size:clamp(13px,2.2vh,20px)}
.box b{display:block;color:var(--navy);font-size:clamp(30px,7.5vh,76px);line-height:1.1;font-variant-numeric:tabular-nums}
.box.ante b{color:#c2467c}
.breakbox{display:none;font-size:clamp(20px,4.4vh,40px);font-weight:800;color:#7a5200}
.breakbox span{display:block;font-size:clamp(14px,2.6vh,24px);font-weight:600;margin-top:4px;color:#8a6a2a}
.next{width:min(100%,820px);background:#f5f7fb;border:2px dashed #cfd8e6;border-radius:18px;padding:clamp(6px,1.2vh,14px) 16px;font-size:clamp(14px,2.6vh,24px);color:#344054;font-weight:600}
.next b{color:var(--navy)}
.elapsed{color:var(--muted);font-size:clamp(12px,2vh,18px)}
.elapsed b{font-variant-numeric:tabular-nums;color:var(--ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(100%,1100px)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:.75em 1.2em;background:#fff;color:var(--navy);box-shadow:0 2px 8px #3b2a5a1a;cursor:pointer;font-size:clamp(14px,2.2vh,18px)}
button:hover{background:#f2f6ff}
button:active{transform:translateY(1px)}
button.main{background:var(--navy);color:#fff;min-width:9em;font-size:clamp(16px,2.8vh,22px)}
button.main:hover{background:var(--blue)}
button.warn{background:#fff0f0;color:#b42318}
.hint{margin:0;color:var(--muted);font-size:12px;text-align:center}
/* break */
body.m-break .card{background:#fff6e0}
body.m-break .chip{background:var(--pink);color:#7a1f48}
body.m-break .time{color:#9a5b00}
body.m-break .blinds{display:none}
body.m-break .breakbox{display:block}
body.m-break .next{background:#fffdf6;border-color:#f0d9a0}
/* end */
body.m-end .blinds{display:none}
body.m-end .breakbox{display:block}
body.m-end .chip{background:var(--yellow);color:#6b4b00}
@media(max-height:560px){.logo{max-height:16vh}}
@media(max-width:640px){.logo{max-height:none}.time{font-size:min(30vw,26vh)}}
@media(min-width:641px){.page{height:100vh;min-height:0}.card{min-height:0}}
@media print{.controls,.hint{display:none}}
</style>

    var a=ac(); if(!a)return;
    var t=a.currentTime+0.02;
    if(kind==='warn'){tone(880,t,0.6)}
    else if(kind==='level'){tone(880,t,0.5);tone(880,t+0.6,0.5);tone(1175,t+1.2,1.0)}
    else if(kind==='break'){[523,659,784,1047].forEach(function(f,i){tone(f,t+i*0.35,0.8)})}
    else if(kind==='end'){[784,659,523,392].forEach(function(f,i){tone(f,t+i*0.55,1.0)})}
  }

  /* wake lock */
  var wl=null;
  function lock(){try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}}catch(e){}}
  function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&s.running)lock()});

  /* control */
  function cur(){return seq[s.idx]}
  function start(){
    if(s.finished||s.remaining<=0&&s.idx===LAST)return;
    ac(); s.running=true; s.endAt=Date.now()+s.remaining; lock(); render();
  }
  function pause(){
    if(!s.running)return;
    s.remaining=Math.max(0,s.endAt-Date.now()); s.running=false; unlock(); render();
  }
  function toggle(){s.running?pause():start()}
  function go(d){
    var ni=Math.min(LAST,Math.max(0,s.idx+d));
    s.idx=ni; s.finished=false; s.remaining=cur().ms; s.warned=false;
    if(s.running)s.endAt=Date.now()+s.remaining;
    render();
  }
  function adjust(ms){
    if(s.finished)return;
    var rem=s.running?Math.max(0,s.endAt-Date.now()):s.remaining;
    rem=Math.min(cur().ms,Math.max(0,rem+ms));
    s.remaining=rem; s.warned=rem<=60000;
    if(s.running)s.endAt=Date.now()+rem;
    render();
  }
  var resetArmed=false,resetTimer=null;
  function reset(){
    var b=$('reset');
    if(!resetArmed){
      resetArmed=true; b.textContent='한 번 더 누르면 초기화';
      resetTimer=setTimeout(function(){resetArmed=false;b.textContent='처음으로'},3000); return;
    }
    clearTimeout(resetTimer); resetArmed=false; b.textContent='처음으로';
    s.idx=0; s.finished=false; s.running=false; s.remaining=seq[0].ms; s.warned=false; unlock(); render();
  }
  function advance(){
    /* called when the current item hit zero while running; returns true if moved on */
    if(s.idx>=LAST){
      s.running=false; s.finished=true; s.remaining=0; unlock(); chime('end'); return false;
    }
    s.idx++; s.warned=false;
    s.endAt+=cur().ms;
    chime(cur().t==='break'?'break':'level');
    return true;
  }
  function tick(){
    if(s.running){
      var rem=s.endAt-Date.now(), guard=0;
      while(rem<=0&&guard++<60){
        if(!advance())break;
        rem=s.endAt-Date.now();
      }
      if(s.running){
        s.remaining=Math.max(0,rem);
        if(!s.warned&&cur().ms>=120000&&rem<=60000&&rem>0){s.warned=true;chime('warn')}
      }
    }
    render();
  }

  /* render */
  function elapsedMs(){
    var sum=0; for(var i=0;i<s.idx;i++)sum+=seq[i].ms;
    return sum+(cur().ms-s.remaining);
  }
  function describe(it){
    if(it.t==='break')return '<b>'+it.label+'</b> ('+(it.ms/60000)+'분)';
    return '<b>레벨 '+it.n+'</b> · 블라인드 <b>'+fmtN(it.sb)+' / '+fmtN(it.bb)+'</b> · 앤티 <b>'+fmtN(it.bb)+'</b>';
  }
  function render(){
    var it=cur(), body=document.body;
    body.className=s.finished?'m-end':(it.t==='break'?'m-break':'m-level');
    var secs=Math.ceil(s.remaining/1000);
    $('time').textContent=pad(Math.floor(secs/60))+':'+pad(secs%60);
    $('fill').style.width=(100*(1-s.remaining/it.ms))+'%';
    var el=Math.floor(elapsedMs()/1000);
    $('elapsed').textContent=pad(Math.floor(el/3600))+':'+pad(Math.floor(el%3600/60))+':'+pad(el%60);
    var note=$('note');
    if(s.finished){
      $('stage').textContent='FINISH'; $('progress').textContent='';
      $('breakbox').innerHTML='토너먼트 종료<span>수고하셨습니다</span>';
      note.className='note'; $('next').style.display='none';
    }else if(it.t==='break'){
      $('stage').textContent='BREAK'; $('progress').textContent=it.label;
      $('breakbox').innerHTML='휴식 시간<span>'+it.tip+'</span>';
      note.className='note'; $('next').style.display='';
      $('next').innerHTML='다음 · '+describe(seq[s.idx+1]);
    }else{
      $('stage').textContent='LEVEL '+it.n; $('progress').textContent=it.n+' / '+TOTAL;
      $('blind').textContent=fmtN(it.sb)+' / '+fmtN(it.bb); $('ante').textContent=fmtN(it.bb);
      var nt=NOTES[it.n];
      if(nt){note.textContent=nt;note.className='note show'}else{note.className='note'}
      var nx=seq[s.idx+1];
      if(nx){$('next').style.display='';$('next').innerHTML='다음 · '+describe(nx)}
      else{$('next').style.display='';$('next').innerHTML='마지막 레벨입니다'}
    }
    $('toggle').textContent=s.finished?'종료됨':(s.running?'일시정지':(s.idx===0&&s.remaining===seq[0].ms?'시작':'계속'));
    $('toggle').disabled=s.finished;
    $('prev').disabled=(s.idx===0); $('nextBtn').disabled=(s.idx===LAST);
    $('sound').textContent=s.muted?'소리 꺼짐':'소리 켜짐';
    document.title=(s.finished?'종료':$('time').textContent)+' · 라티파티 홀덤 타이머';
  }
  function fullscreen(){
    var d=document, e=d.documentElement;
    try{ if(d.fullscreenElement){d.exitFullscreen()} else if(e.requestFullscreen){e.requestFullscreen()} }catch(x){}
  }
  function mute(){s.muted=!s.muted; if(!s.muted)ac(); render()}

  $('toggle').onclick=toggle;
  $('prev').onclick=function(){go(-1)};
  $('nextBtn').onclick=function(){go(1)};
  $('minus').onclick=function(){adjust(-60000)};
  $('plus').onclick=function(){adjust(60000)};
  $('sound').onclick=mute;
  $('full').onclick=fullscreen;
  $('reset').onclick=reset;
  document.addEventListener('keydown',function(e){
    if(e.target&&e.target.tagName==='BUTTON'&&e.key===' ')return;
    if(e.key===' '){e.preventDefault();toggle()}
    else if(e.key==='ArrowLeft'){go(-1)}
    else if(e.key==='ArrowRight'){go(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();adjust(60000)}
    else if(e.key==='ArrowDown'){e.preventDefault();adjust(-60000)}
    else if(e.key==='f'||e.key==='F'){fullscreen()}
    else if(e.key==='m'||e.key==='M'){mute()}
  });
  setInterval(tick,200);
  render();
})();
</script>
</body>
</html>
